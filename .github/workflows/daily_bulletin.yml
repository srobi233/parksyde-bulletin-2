name: Daily Bulletin

# 20:00 UTC = 6am AEST. GitHub's scheduler is best-effort and can run late
# under load; a bulletin that lands at 6:20 is still the morning's bulletin.
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let two days overlap. The job commits to main, so a second run
# starting before the first has pushed would fight it.
concurrency:
  group: daily-bulletin
  cancel-in-progress: false

jobs:
  generate-bulletin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check the generator parses
        # Half a second, and it catches a truncated or mis-pasted script
        # before the run spends a single token.
        run: python -m py_compile generate_bulletin.py

      - name: Generate bulletin
        env:
          # Unbuffered, so the script's own progress lines appear in the log in
          # the order they happened rather than after a fatal error.
          PYTHONUNBUFFERED: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PARKSYDE_WEBHOOK: ${{ secrets.PARKSYDE_WEBHOOK }}
          PARKSYDE_WEBHOOK_SECRET: ${{ secrets.PARKSYDE_WEBHOOK_SECRET }}
        run: python generate_bulletin.py

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/
          git diff --staged --quiet && echo "No new output to commit" && exit 0
          git commit -m "Daily bulletin $(date +%Y-%m-%d)"
          # Someone may have pushed while the bulletin was generating.
          git pull --rebase origin main
          git push
